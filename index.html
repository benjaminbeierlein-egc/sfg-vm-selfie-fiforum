<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#09121D">
<title>VM-Selfie · EUROGROUP CONSULTING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: mobile-first single column; navy "Panel" + white work surface, as in the EGC deck. One committed light brand look. */
:root{
  --navy:#09121D; --navy-2:#12253E; --navy-3:#364B66; --slate:#59708F; --mist:#ACBDD4; --ice:#D9E4F3;
  --red:#F43A47; --red-dk:#AA0F19; --green:#3E9A52; --gold:#B8971F;
  --bg:#F4F6FA; --surface:#FFFFFF; --ink:#09121D; --muted:#59708F; --line:#D9E4F3;
  --font:"Albert Sans","Aptos","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
.wrap{max-width:620px;margin:0 auto;padding-inline:16px}

/* top bar */
.bar{background:var(--navy);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px}
.egc{font-weight:800;letter-spacing:.08em;color:var(--red);font-size:18px}
.brand small{font-size:13px;color:var(--mist);letter-spacing:.02em}
.ver{font-size:11px;color:var(--mist);letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.progress{height:4px;background:var(--navy-2)}
.progress i{display:block;height:100%;width:0;background:var(--red);transition:width .35s ease}

.proto{background:#FFF3D6;color:#5A4500;font-size:12.5px;text-align:center;padding:6px 16px}

main{padding-block:20px 48px}
.screen{display:flex;flex-direction:column;gap:20px;animation:in .3s ease}
@keyframes in{from{transform:translateY(6px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.progress i{transition:none}}

.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.lead{color:var(--muted);font-size:15.5px}

/* hero */
.hero{background:var(--navy);color:#fff;border-radius:4px;padding:24px 20px;display:grid;gap:18px}
.hero h1{font-size:clamp(28px,7vw,38px);font-weight:800}
.hero h1 span{color:var(--red)}
.hero p{color:var(--ice);font-size:15.5px}
.hero .sun{max-width:260px;justify-self:center;width:100%}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{border:1px solid var(--navy-3);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ice)}

/* cards & questions */
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px}
.qhead{display:grid;gap:8px}
.qhead h2{font-size:clamp(21px,5.2vw,26px);font-weight:800}
.qref{font-size:12.5px;color:var(--muted)}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:4px;padding:14px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--mist)}
.opt:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.opt .lvl{width:28px;height:28px;border-radius:50%;background:var(--ice);color:var(--navy-2);display:grid;place-items:center;font-weight:700;font-size:13px}
.opt[aria-pressed="true"]{border-color:var(--navy);background:#EEF3FA}
.opt[aria-pressed="true"] .lvl{background:var(--red);color:#fff}
.opt b{display:block;font-weight:600}

.field{display:grid;gap:6px}
.field label,.legend{font-size:13.5px;font-weight:600}
.field label em{color:var(--red);font-style:normal}
.field input,.field select{width:100%;border:1.5px solid var(--line);border-radius:4px;padding:12px;background:#fff}
.field input[aria-invalid="true"]{border-color:var(--red)}
.grid2{display:grid;gap:14px}
@media(min-width:520px){.grid2{grid-template-columns:1fr 1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14.5px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.slider{display:grid;gap:8px}
.slider input{width:100%;accent-color:var(--red)}
.slider .scale{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.slider output{font-weight:800;font-size:28px;color:var(--navy);font-variant-numeric:tabular-nums}
.consent{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:13.5px;color:var(--muted);align-items:start}
.consent input{width:20px;height:20px;accent-color:var(--red);margin:1px 0 0}
.note{font-size:13.5px;background:#EEF3FA;border-left:3px solid var(--navy);padding:10px 12px;color:var(--navy-2)}
.err{color:var(--red-dk);font-size:13.5px;font-weight:600}

.nav{display:flex;gap:10px;justify-content:space-between;align-items:center}
.btn{border:0;border-radius:4px;padding:14px 20px;font-weight:700;cursor:pointer;background:var(--red);color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--red-dk)}
.btn[disabled]{background:var(--mist);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--navy)}
.btn.block{width:100%}

/* result */
.score{background:var(--navy);color:#fff;border-radius:4px;padding:22px 20px;display:grid;gap:16px}
.score .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pct{font-size:64px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.pct small{font-size:26px;color:var(--mist)}
.level{display:inline-block;background:var(--red);color:#fff;font-weight:700;border-radius:999px;padding:5px 14px;font-size:14px}
.scale4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.scale4 div{font-size:11px;color:var(--mist);border-top:4px solid var(--navy-3);padding-top:6px}
.scale4 div.on{border-color:var(--red);color:#fff;font-weight:700}
.score .sun{max-width:300px;width:100%;justify-self:center}
.mirror{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mirror div{background:var(--navy-2);border-radius:4px;padding:12px}
.mirror span{display:block;font-size:12px;color:var(--mist)}
.mirror b{font-size:24px;font-variant-numeric:tabular-nums}
.mirrortext{color:var(--ice);font-size:15px}
.dims{display:grid;gap:12px}
.dim{background:#fff;border:1px solid var(--line);border-radius:4px;padding:16px;display:grid;gap:10px}
.dim header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dim h3{font-size:17px;font-weight:800}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.r{background:#FDE3E5;color:var(--red-dk)}.pill.y{background:#F8EFCC;color:#6E5A0E}.pill.g{background:#DDF1E1;color:#23642F}
.dots{display:flex;gap:4px}.dots i{width:22px;height:6px;border-radius:2px;background:var(--ice)}.dots i.on{background:var(--navy)}
.dim dl{display:grid;gap:8px;margin:0}
.dim dt{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dim dd{margin:0;font-size:14.5px}
.dim dd.egc{border-left:3px solid var(--red);padding-left:10px}
.cta{background:#fff;border:1px solid var(--line);border-radius:4px;padding:20px;display:grid;gap:14px}
.code{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border:1.5px dashed var(--mist);border-radius:4px;padding:12px 14px}
.code b{font-size:24px;letter-spacing:.1em;font-variant-numeric:tabular-nums}
.code span{font-size:13px;color:var(--muted)}
footer{padding-block:0 32px;font-size:12.5px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--muted)}

.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.sendnote{font-size:13.5px;border-radius:4px;padding:10px 12px}
.sendnote.warn{background:#FDE3E5;color:var(--red-dk)}
.sendnote.ok{background:#DDF1E1;color:#23642F}
</style>
</head>
<body>

<div class="bar">
  <div class="wrap">
    <div class="brand"><span class="egc">EGC</span><small>VM-Selfie · Vertriebsmanagement 2030</small></div>
    <span class="ver" id="ver">v0.9</span>
  </div>
  <div class="progress"><i id="prog"></i></div>
</div>
<div class="proto" id="testBanner" hidden>Testmodus: Es ist noch keine Speicheradresse hinterlegt. Antworten werden nur in der Browser-Konsole angezeigt.</div>

<main class="wrap" id="app"></main>

<footer><div class="wrap"><span>EUROGROUP CONSULTING · Quick-Check orientiert am DSGV-Arbeitsstand VdZ PK 2.2, Modul 5 (04/2026). Kein offizielles DSGV-Werkzeug.</span><a id="dsLink" href="#" target="_blank" rel="noopener">Datenschutz</a></div></footer>

<script>
(function(){
/* ================= KONFIGURATION ================= */
const VERSION = "v1.0";            // bei jeder inhaltlichen Änderung hochzählen
const SUPABASE_URL = "HIER_PROJECT_URL_EINFUEGEN";       // z. B. https://abcdefgh.supabase.co
const SUPABASE_KEY = "HIER_PUBLISHABLE_KEY_EINFUEGEN";   // "publishable" bzw. "anon public" Key (ist öffentlich gedacht)
const DATENSCHUTZ_URL = "";        // z. B. Link zur EGC-Datenschutzerklärung; leer = Hinweis "Link folgt"
const BOOKINGS = "https://bookings.cloud.microsoft/bookwithme/user/9f113bfb868b4a6d950b16057dce8a89@eurogroupconsulting.de?anonymous&ismsaljsauthenabled&ep=pcard";
/* ================================================= */
document.getElementById("ver").textContent = "Fragebogen " + VERSION;
const LIVE = /^https:\/\/.+\.supabase\.co/.test(SUPABASE_URL) && !/^HIER_/.test(SUPABASE_KEY);
const ENDPOINT = SUPABASE_URL.replace(/\/+$/,"") + "/rest/v1/vm_selfie";
if(!LIVE) document.getElementById("testBanner").hidden = false;
(function(){const a=document.getElementById("dsLink"); if(DATENSCHUTZ_URL){a.href=DATENSCHUTZ_URL;} else {a.removeAttribute("href");a.textContent="Datenschutzhinweise: Link folgt";}})();

const DIMS = [
  {key:"pkfk", short:"PK/FK", title:"Integration PK & FK",
   q:"Wie ist Ihr Vertriebsmanagement für Privat- und Firmenkunden aufgestellt?",
   ref:"VdZ PK 2.2 Eckpfeiler: Ausgewogenheit der Segmente",
   opts:["Zwei getrennte Einheiten mit eigener Steuerung","Getrennte Einheiten, aber gemeinsame Gremien und Abstimmungen","Gemeinsame Führung, darunter Teams je Segment","Ein integriertes VM über alle Segmente, FK-Spezifika gezielt abgebildet"],
   vdz:"Ausgewogene Kapazität für Privat- und Firmenkunden: Mengengeschäft vernetzt steuern, Individualgeschäft gezielt fokussieren.",
   egc:"PK- und FK-Vertriebsmanagement unter eine gemeinsame Führung bringen. Spezifika wie Konsortialgeschäft oder Kommunen bleiben erhalten, Doppelarbeiten und Schnittstellen entfallen."},
  {key:"change", short:"Change", title:"Run vs. Change",
   q:"Welcher Anteil der VM-Kapazität fließt heute in Weiterentwicklung statt in den laufenden Betrieb?",
   ref:"VdZ PK 2.2 Eckpfeiler: VM als Veränderungstreiber",
   opts:["Unter 20 %, das Tagesgeschäft dominiert","20 bis 35 %","35 bis 50 %","Mehr als 50 %"],
   vdz:"Entlastung im Run durch zentrale Standards wie Standard-Reportings und Dashboards, damit mehr Kapazität für Change entsteht.",
   egc:"Operative Vertriebsunterstützung zentralisieren, standardisieren oder automatisieren. So wird das VM vom administrativen Unterstützer zum strategischen Steuerungszentrum."},
  {key:"kanal", short:"Kanäle", title:"Multikanalsteuerung",
   q:"Wer steuert die digitalen und medialen Kanäle (Internet-Filiale, App, KSC, DBC) vertrieblich?",
   ref:"VdZ PK 2.2 Eckpfeiler: Digital und stationär",
   opts:["Keine klare vertriebliche Verantwortung, eher Orga/IT","Jeder Kanal wird separat gesteuert","Das VM steuert alle Kanäle, aber ohne durchgängiges Tracking","Das VM steuert integriert, mit Tracking von der Zuführung bis zum Abschluss"],
   vdz:"Ganzheitliche, vernetzte Steuerung über alle Kanäle mit vertrieblicher Verantwortung für die digitalen Kanäle und Tracking entlang der gesamten Kundenreise.",
   egc:"Kanäle nach Kundenverantwortung organisieren und zentral über das IAM aussteuern. Das schafft ein konsistentes Kundenerlebnis über alle Kanäle."},
  {key:"e2e", short:"E2E", title:"Produkt & Prozess",
   q:"Wie sind Produkt-, Prozess- und Anwendungsverantwortung in Ihrem Haus geregelt?",
   ref:"VdZ PK 2.2 Eckpfeiler: E2E-Produkt-/Prozessmanagement",
   opts:["Getrennt: Produkte im VM, Prozesse und Anwendungen in Orga/IT","Getrennt, mit punktueller Abstimmung","Themenbezogene, bereichsübergreifende Teams, z. B. mit Product Ownern","Bedarfsfeldmanagement: Produkte, Prozesse und Anwendungen gebündelt verantwortet"],
   vdz:"Produkte, Services und Prozesse aus Kundensicht zusammendenken, end-to-end von der Produktgestaltung bis zur Prozessgestaltung, getragen von interdisziplinären Teams.",
   egc:"Bedarfsfeldmanagement: Produkte, Prozesse und Anwendungen entlang der Bedarfsfelder bündeln und klar verankern, im VM oder in der Orga."},
  {key:"steuerung", short:"Steuerung", title:"Vertriebssteuerung",
   q:"Wie steuert Ihr Vertriebsmanagement den Vertrieb heute?",
   ref:"VdZ PK 2.2 Leistungsbausteine 5 und 6: Planung, Steuerung & Controlling inkl. IAM",
   opts:["Überwiegend manuell, mit Excel-Auswertungen und Zielkarten","Mit Standard-Reportings, z. B. aus OSPlus-BI","Mit dem IAM als führender Anwendung und einem einheitlichen Dashboard","Daten- und KI-gestützt, mit vorausschauenden Steuerungsimpulsen"],
   vdz:"Vertriebsplanung inklusive Zielkarten sowie Steuerung und Controlling inklusive IAM auf Basis zentraler Standards.",
   egc:"Steuerung im geschlossenen Kreislauf: Das Vertriebscontrolling schafft neutrale Transparenz, die Vertriebssteuerung setzt vorausschauende Impulse."}
];
const ROLES = ["Vorstand","Leitung Vertriebsmanagement","Fachebene VM","Vertrieb / Markt","Orga / Steuerung","Verbund / Dienstleister"];
const SIZES = ["< 2 Mrd. €","2–5 Mrd. €","5–10 Mrd. €","> 10 Mrd. €"];
const LEVELS = [
  {name:"Starter", max:33, text:"Ihr Vertriebsmanagement arbeitet noch weitgehend im klassischen Modell. Der Weg zum Zielbild ist lang, bietet aber viel Hebel."},
  {name:"Aufbruch", max:66, text:"Erste Bausteine des Zielbilds sind gelegt. Jetzt geht es darum, sie zu einem Gesamtbild zu verbinden."},
  {name:"Gestalter", max:89, text:"Ihr Haus ist auf einem guten Weg. Die verbleibenden Lücken sind gezielt adressierbar."},
  {name:"Zielbild-2030-ready", max:100, text:"Ihr Vertriebsmanagement entspricht in den Kernpunkten bereits dem Zielbild. Spannend ist jetzt die Feinsteuerung."}
];

/* ---------- state (in memory only: every reload starts fresh) ---------- */
const kiosk = location.hash === "#kiosk";
let s;
function reset(){ s = {id:null, t0:0, hp:"", sent:null, step:"start", ctx:{role:null,size:null,self:5,selfTouched:false}, ans:[null,null,null,null,null], contact:{vorname:"",name:"",institut:"",email:"",position:"",telefon:"",ok:false}, code:null}; }
reset();
/* ---------- Übermittlung ---------- */
const PENDING_KEY="vmselfie_pending";
function uid(){ try{return crypto.randomUUID();}catch(e){return Date.now().toString(36)+Math.random().toString(36).slice(2,10);} }
function readPending(){ try{return JSON.parse(sessionStorage.getItem(PENDING_KEY)||"[]");}catch(e){return [];} }
function writePending(list){ try{ list.length?sessionStorage.setItem(PENDING_KEY,JSON.stringify(list)):sessionStorage.removeItem(PENDING_KEY);}catch(e){} }
async function send(payload,{keepalive=false}={}){
  if(!LIVE){ console.info("[VM-Selfie Testmodus] würde senden:",payload); return true; }
  const headers={"Content-Type":"application/json","apikey":SUPABASE_KEY,"Prefer":"return=minimal"};
  if(SUPABASE_KEY.startsWith("eyJ")) headers.Authorization="Bearer "+SUPABASE_KEY; // älteres "anon"-Schlüsselformat
  for(let attempt=0; attempt<2; attempt++){
    try{
      const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),10000);
      const r=await fetch(ENDPOINT,{method:"POST",headers,body:JSON.stringify(payload),keepalive,signal:ctrl.signal});
      clearTimeout(t);
      if(r.ok) return true;
      if(r.status>=400 && r.status<500){ console.warn("VM-Selfie: Eintrag abgelehnt",r.status,await r.text().catch(()=>"")); return false; }
    }catch(e){ /* Netzwerkfehler: zweiter Versuch */ }
  }
  return false;
}
async function flushPending(){ const list=readPending(); if(!list.length) return; const rest=[]; for(const p of list){ if(!(await send(p))) rest.push(p);} writePending(rest); }
function base(typ){ return {typ, selfie_id:s.id, zeitstempel:new Date().toISOString(), version:VERSION, modus: kiosk?"iPad-Stand":"QR/Handy"}; }

/* ---------- helpers ---------- */
const app = document.getElementById("app");
const prog = document.getElementById("prog");
const esc = t => String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pctOf = a => Math.round(a.reduce((x,y)=>x+(y||0),0)/15*100);
const levelOf = p => LEVELS.findIndex(l=>p<=l.max);
const ORDER = ["start","ctx",0,1,2,3,4,"contact","result"];
function setProg(){ const i=ORDER.indexOf(s.step); prog.style.width = Math.max(0,i)/(ORDER.length-1)*100+"%"; }

function arc(cx,cy,r0,r1,a0,a1){
  const p=(r,a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];
  const [x0,y0]=p(r1,a0),[x1,y1]=p(r1,a1),[x2,y2]=p(r0,a1),[x3,y3]=p(r0,a0);
  const large=(a1-a0)>Math.PI?1:0;
  return `M${x0.toFixed(2)},${y0.toFixed(2)}A${r1},${r1} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)}L${x2.toFixed(2)},${y2.toFixed(2)}A${r0},${r0} 0 ${large} 0 ${x3.toFixed(2)},${y3.toFixed(2)}Z`;
}
/* "VM-Sonne": five segments around the VM core, as in the EGC deck. values: 0..3 or null */
function sun(values,{labels=false,dark=true}={}){
  const R0=36,R1=104,gap=0.05,seg=2*Math.PI/5,start=-Math.PI/2-seg/2;
  let out="";
  for(let i=0;i<5;i++){
    const a0=start+i*seg+gap,a1=start+(i+1)*seg-gap;
    out+=`<path d="${arc(0,0,R0,R1,a0,a1)}" fill="${dark?'#12253E':'#D9E4F3'}" stroke="${dark?'#364B66':'#ACBDD4'}" stroke-width="1"/>`;
    const v=values[i];
    if(v!==null&&v!==undefined){
      const r=R0+ (R1-R0)*Math.max(v,0.25)/3;
      out+=`<path d="${arc(0,0,R0,r,a0,a1)}" fill="#F43A47" opacity="${v===0?0.55:1}"/>`;
    }
    const mid=(a0+a1)/2;
    const nx=Math.cos(mid)*((R0+R1)/2+20), ny=Math.sin(mid)*((R0+R1)/2+20);
    out+=`<text x="${(Math.cos(mid)*84).toFixed(1)}" y="${(Math.sin(mid)*84+5).toFixed(1)}" text-anchor="middle" font-size="14" font-weight="700" fill="${dark?'#59708F':'#8297B2'}" font-family="Albert Sans,sans-serif">0${i+1}</text>`;
    if(labels){
      const lx=Math.cos(mid)*126, ly=Math.sin(mid)*126+4;
      out+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-size="12.5" font-weight="600" fill="${dark?'#D9E4F3':'#364B66'}" font-family="Albert Sans,sans-serif">${DIMS[i].short}</text>`;
    }
  }
  out+=`<circle r="30" fill="#F43A47"/><text y="7" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" font-family="Albert Sans,sans-serif">VM</text>`;
  const vb=labels?"-160 -150 320 300":"-112 -112 224 224";
  return `<svg class="sun" viewBox="${vb}" role="img" aria-label="VM-Sonne mit fünf Bereichen">${out}</svg>`;
}

function go(step){ s.step=step; render(); window.scrollTo(0,0); }

/* ---------- screens ---------- */
function vStart(){
  return `<section class="screen">
    <div class="hero">
      <span class="eyebrow">Quick-Check · FI-Forum 2026</span>
      <h1>Wie fit ist Ihr Vertriebs&shy;management für <span>VdZ PK 2.2</span>?</h1>
      <p>Fünf Fragen, zwei Minuten. Sie sehen sofort, wo Ihr Haus im Vergleich zum Zielbild steht und was EGC an Ihrer Stelle als Nächstes angehen würde.</p>
      ${sun([null,null,null,null,null])}
      <div class="facts"><span>5 Fragen</span><span>ca. 2 Minuten</span><span>Ergebnis sofort</span></div>
    </div>
    <button class="btn block" id="startBtn">Selfie starten</button>
  </section>`;
}
function vCtx(){
  const c=s.ctx;
  return `<section class="screen">
    <div class="qhead"><span class="eyebrow">Zum Einstieg</span><h2>Kurz zu Ihnen und Ihrem Haus</h2><p class="lead">Diese Angaben fließen nicht in die Bewertung ein.</p></div>
    <div class="card" style="display:grid;gap:20px">
      <div class="field"><span class="legend">Ihre Rolle</span><div class="chips" data-group="role">${ROLES.map(r=>`<button class="chip" aria-pressed="${c.role===r}" data-v="${esc(r)}">${esc(r)}</button>`).join("")}</div></div>
      <div class="field"><span class="legend">Bilanzsumme Ihres Instituts</span><div class="chips" data-group="size">${SIZES.map(r=>`<button class="chip" aria-pressed="${c.size===r}" data-v="${esc(r)}">${esc(r)}</button>`).join("")}</div></div>
      <div class="slider"><label class="legend" for="selfRange">Ihr Bauchgefühl: Wie gut ist Ihr Haus auf VdZ PK 2.2 vorbereitet?</label>
        <output id="selfOut">${c.self}</output>
        <input type="range" id="selfRange" min="1" max="10" step="1" value="${c.self}">
        <div class="scale"><span>1 · noch gar nicht</span><span>10 · vollständig</span></div></div>
    </div>
    <div class="nav"><button class="btn ghost" data-go="start">Zurück</button><button class="btn" id="ctxNext" ${c.role&&c.size?"":"disabled"}>Weiter zu Frage 1</button></div>
  </section>`;
}
function vQ(i){
  const d=DIMS[i], a=s.ans[i];
  return `<section class="screen">
    <div class="qhead"><span class="eyebrow">Frage ${i+1} von 5 · ${esc(d.title)}</span><h2>${esc(d.q)}</h2><p class="qref">${esc(d.ref)}</p></div>
    <div class="opts" role="group" aria-label="Antwortoptionen">${d.opts.map((o,k)=>`<button class="opt" data-k="${k}" aria-pressed="${a===k}"><span class="lvl">${String.fromCharCode(65+k)}</span><b>${esc(o)}</b></button>`).join("")}</div>
    <div class="nav"><button class="btn ghost" data-go="${i===0?'ctx':i-1}">Zurück</button><button class="btn" id="qNext" ${a===null?"disabled":""}>${i===4?"Zum Ergebnis":"Weiter"}</button></div>
  </section>`;
}
function vContact(){
  const c=s.contact;
  const f=(id,label,req,type="text",ac="")=>`<div class="field"><label for="f_${id}">${label}${req?" <em>*</em>":""}</label><input id="f_${id}" type="${type}" ${ac?`autocomplete="${ac}"`:""} value="${esc(c[id])}" ${req?"required":""}></div>`;
  return `<section class="screen">
    <div class="qhead"><span class="eyebrow">Fast geschafft</span><h2>Wer macht das Selfie?</h2></div>
    <div class="note">Ihr Ergebnis sehen Sie direkt im Anschluss auf dieser Seite.</div>
    <form class="card" id="contactForm" novalidate style="display:grid;gap:14px">
      <div class="grid2">${f("vorname","Vorname",true,"text","given-name")}${f("name","Name",true,"text","family-name")}</div>
      ${f("institut","Institut",true,"text","organization")}
      ${f("email","E-Mail",true,"email","email")}
      <div class="grid2">${f("position","Position",false,"text","organization-title")}${f("telefon","Telefon",false,"tel","tel")}</div>
      <label class="consent"><input type="checkbox" id="f_ok" ${c.ok?"checked":""}><span>Ich bin einverstanden, dass EUROGROUP CONSULTING meine Angaben speichert und mich zu meinem Ergebnis und zum Thema Vertriebsmanagement kontaktiert. Die Einwilligung kann ich jederzeit widerrufen. <em style="font-style:normal;color:var(--red)">*</em><br><span style="color:var(--slate)">${DATENSCHUTZ_URL?`<a href="${esc(DATENSCHUTZ_URL)}" target="_blank" rel="noopener" style="color:inherit">Datenschutzhinweise lesen</a>`:"Datenschutzhinweise: Link folgt"}</span></span></label>
      <div class="hp" aria-hidden="true"><label for="f_web">Webseite</label><input id="f_web" tabindex="-1" autocomplete="off"></div>
      <p class="err" id="formErr" hidden></p>
      <div class="nav"><button type="button" class="btn ghost" data-go="4">Zurück</button><button type="submit" class="btn" id="submitBtn">Ergebnis anzeigen</button></div>
    </form>
  </section>`;
}
function statusOf(v){ return v>=3?["g","Zielbildnah"]:v===2?["y","Auf dem Weg"]:["r","Handlungsfeld"]; }
function vResult(){
  const p=pctOf(s.ans), li=levelOf(p), L=LEVELS[li];
  const self=s.ctx.self*10, diff=self-p;
  const mt = diff>15 ? "Sie schätzen Ihr Haus deutlich stärker ein, als Ihre Antworten zeigen. Genau diese Lücke lohnt ein genaueres Hinsehen."
           : diff<-15 ? "Ihr Haus ist weiter, als Sie selbst vermuten. Ein guter Ausgangspunkt, um die nächsten Schritte gezielt zu setzen."
           : "Selbstbild und Ergebnis liegen nah beieinander. Sie kennen Ihr Haus gut.";
  return `<section class="screen">
    <div class="score">
      <span class="eyebrow">Ihr VM-Selfie · Tipp: Screenshot machen</span>
      <div class="top"><div class="pct">${p}<small> %</small></div><span class="level">${esc(L.name)}</span></div>
      <p class="mirrortext">${esc(L.text)}</p>
      <div class="scale4">${LEVELS.map((l,k)=>`<div class="${k===li?'on':''}">${esc(l.name)}</div>`).join("")}</div>
      ${sun(s.ans,{labels:true})}
      <div class="mirror"><div><span>Ihr Bauchgefühl</span><b>${self} %</b></div><div><span>Ihr Ergebnis</span><b>${p} %</b></div></div>
      <p class="mirrortext">${esc(mt)}</p>
    </div>
    <div class="sectiontitle"><h2>Ihre fünf Bereiche</h2><span class="qref">Ihr Stand · Zielbild VdZ PK 2.2 · EGC-Impuls</span></div>
    <div class="dims">${DIMS.map((d,i)=>{const v=s.ans[i];const [c,t]=statusOf(v);return `<article class="dim">
      <header><h3>0${i+1} ${esc(d.title)}</h3><div style="display:flex;gap:10px;align-items:center"><div class="dots" aria-label="${v} von 3">${[1,2,3].map(n=>`<i class="${v>=n?'on':''}"></i>`).join("")}</div><span class="pill ${c}">${t}</span></div></header>
      <dl><div><dt>Ihr Stand</dt><dd>${esc(d.opts[v])}</dd></div>
      <div><dt>Zielbild VdZ PK 2.2</dt><dd>${esc(d.vdz)}</dd></div>
      <div><dt>EGC-Impuls</dt><dd class="egc">${esc(d.egc)}</dd></div></dl></article>`;}).join("")}</div>
    <div class="cta">
      <span class="eyebrow">Wie geht es weiter?</span>
      <h2 style="font-size:22px;font-weight:800">Ergebnis gemeinsam einordnen</h2>
      ${s.sent===false?`<div class="sendnote warn">Ihr Ergebnis konnte gerade nicht übertragen werden. Bitte nennen Sie am EGC-Stand Ihren Code, wir kümmern uns darum. <button class="btn ghost" id="retry" style="margin-top:8px;padding:8px 14px">Erneut senden</button></div>`:""}
      <div class="code"><div><span>Ihr Code für den EGC-Stand</span><br><b>${s.code}</b></div><span style="text-align:right">Zeigen Sie ihn unseren Beratern<br>am Stand</span></div>
      <a class="btn block" href="${BOOKINGS}" target="_blank" rel="noopener">Termin mit EGC buchen</a>
      <p class="qref">Öffnet unsere Microsoft-Bookings-Seite in einem neuen Fenster.</p>
      <button class="btn ghost block" id="restart">${kiosk?"Nächste Person: neu starten":"Selfie neu starten"}</button>
    </div>
  </section>`;
}
/* ---------- render + events ---------- */
let idleTimer=null;
function render(){
  setProg();
  const st=s.step;
  app.innerHTML = st==="start"?vStart(): st==="ctx"?vCtx(): typeof st==="number"?vQ(st): st==="contact"?vContact(): vResult();
  bind();
  clearTimeout(idleTimer);
  if(kiosk && st==="result"){ armIdle(); }
}
function armIdle(){ clearTimeout(idleTimer); idleTimer=setTimeout(()=>{ if(s.step==="result"){ reset(); render(); } },90000); }
["click","touchstart","keydown","scroll"].forEach(ev=>window.addEventListener(ev,()=>{ if(kiosk&&s.step==="result") armIdle(); },{passive:true}));

function bind(){
  app.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{const g=b.dataset.go;go(isNaN(+g)?g:+g);}));
  const sb=document.getElementById("startBtn"); if(sb) sb.onclick=()=>{ s.id=uid(); s.t0=Date.now(); send(base("start"),{keepalive:true}); go("ctx"); };
  app.querySelectorAll("[data-group]").forEach(g=>g.addEventListener("click",e=>{
    const b=e.target.closest(".chip"); if(!b) return; s.ctx[g.dataset.group]=b.dataset.v;
    g.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b));
    document.getElementById("ctxNext").disabled=!(s.ctx.role&&s.ctx.size);
  }));
  const r=document.getElementById("selfRange"); if(r) r.oninput=()=>{s.ctx.self=+r.value;document.getElementById("selfOut").textContent=r.value;};
  const cn=document.getElementById("ctxNext"); if(cn) cn.onclick=()=>go(0);
  if(typeof s.step==="number"){
    const i=s.step;
    app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
      s.ans[i]=+b.dataset.k; app.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",x===b));
      document.getElementById("qNext").disabled=false;
    }));
    document.getElementById("qNext").onclick=()=>go(i===4?"contact":i+1);
  }
  const form=document.getElementById("contactForm");
  if(form){
    ["vorname","name","institut","email","position","telefon"].forEach(k=>{const el=document.getElementById("f_"+k);el.oninput=()=>{s.contact[k]=el.value;el.removeAttribute("aria-invalid");};});
    document.getElementById("f_ok").onchange=e=>{s.contact.ok=e.target.checked;};
    form.addEventListener("submit",async e=>{
      e.preventDefault();
      const c=s.contact, miss=[];
      [["vorname","Vorname"],["name","Name"],["institut","Institut"],["email","E-Mail"]].forEach(([k,l])=>{const bad=!c[k].trim()||(k==="email"&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c[k].trim()));if(bad){miss.push(l);document.getElementById("f_"+k).setAttribute("aria-invalid","true");}});
      const err=document.getElementById("formErr");
      if(miss.length||!c.ok){ err.hidden=false; err.textContent = miss.length ? "Bitte ergänzen: "+miss.join(", ")+(c.ok?"":" und Einwilligung bestätigen")+"." : "Bitte bestätigen Sie die Einwilligung, um Ihr Ergebnis zu sehen."; return; }
      s.code="VM-"+String(1000+Math.floor(Math.random()*9000));
      const p=pctOf(s.ans);
      const payload={...base("abschluss"), code:s.code,
        vorname:c.vorname.trim(), name:c.name.trim(), institut:c.institut.trim(), email:c.email.trim(), position:c.position.trim(), telefon:c.telefon.trim(),
        einwilligung:true, rolle:s.ctx.role, bilanzsumme:s.ctx.size, selbsteinschaetzung:s.ctx.self,
        a1_pkfk:s.ans[0], a2_change:s.ans[1], a3_kanaele:s.ans[2], a4_e2e:s.ans[3], a5_steuerung:s.ans[4],
        ergebnis_prozent:p, reifegrad:LEVELS[levelOf(p)].name, dauer_sek:Math.round((Date.now()-s.t0)/1000),
        verdacht_spam: !!document.getElementById("f_web").value };
      const btn=document.getElementById("submitBtn"); btn.disabled=true; btn.textContent="Wird übertragen …";
      s.payload=payload;
      s.sent = payload.verdacht_spam ? true : await send(payload);
      if(!s.sent){ writePending([...readPending(),payload]); }
      go("result");
    });
  }
  const rs=document.getElementById("restart"); if(rs) rs.onclick=()=>{reset();render();window.scrollTo(0,0);};
  const bk=app.querySelector('a[href^="https://bookings"]'); if(bk) bk.addEventListener("click",()=>{ send({...base("bookings"),code:s.code},{keepalive:true}); });
  const rt=document.getElementById("retry"); if(rt) rt.onclick=async()=>{ rt.disabled=true; rt.textContent="Wird gesendet …"; const ok=await send(s.payload); if(ok){ writePending(readPending().filter(p=>p.selfie_id!==s.payload.selfie_id)); s.sent=true; } render(); };
}
flushPending();
render();
})();
</script>
</body>
</html>
